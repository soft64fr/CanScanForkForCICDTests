name: Check VC_redist version, build and Release Native Windows App

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------------
  # 0. JOB WINDOWS/Check VC_redist version
  # ------------------------------------------------------------------------
  check_vc_redist_version:
    name: Check VC_redist version
    runs-on: windows-latest
    permissions:
      contents: read
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Validate Version
      shell: powershell
      run: |
        $localPath = ".myresources/VCRUNTIME/VC_redist.x64.exe"
        $url = "https://aka.ms/vc14/vc_redist.x64.exe"
        $summaryPath = $env:GITHUB_STEP_SUMMARY

        $msg = "Verification de la version de VC Redist..."
        $msg | Out-File -FilePath $summaryPath -Append
        Write-Host $msg

        # Verifier que le fichier local existe
        if (-not (Test-Path $localPath)) {
            $msg = "Fichier local introuvable : $localPath"
            $msg | Out-File -FilePath $summaryPath -Append
            Write-Host $msg
            exit 1
        }

        # Version locale
        $localVer = [version](Get-Item $localPath).VersionInfo.FileVersion
        $msg = "Version locale : $localVer"
        $msg | Out-File -FilePath $summaryPath -Append
        Write-Host $msg

        # Obtenir l URL finale via la redirection
        $response = Invoke-WebRequest -Uri $url -MaximumRedirection 0 -ErrorAction SilentlyContinue -UseBasicParsing
        $redirectUrl = $response.Headers.Location

        $msg = "URL finale : $redirectUrl"
        $msg | Out-File -FilePath $summaryPath -Append
        Write-Host $msg

        # Telecharger seulement 1 MB du fichier distant
        $req = [System.Net.HttpWebRequest]::Create($redirectUrl)
        $req.AddRange(0,1000000)
        $res = $req.GetResponse()

        $tempFile = [System.IO.Path]::GetTempFileName()
        $stream = $res.GetResponseStream()
        $fs = [System.IO.File]::OpenWrite($tempFile)
        $stream.CopyTo($fs)
        $fs.Close()
        $stream.Close()

        # Version distante
        $remoteVer = [version](Get-Item $tempFile).VersionInfo.FileVersion
        $msg = "Version distante : $remoteVer"
        $msg | Out-File -FilePath $summaryPath -Append
        Write-Host $msg

        # Si la version distante est vide -> ECHEC
        if (-not $remoteVer) {
            $msg = "ERREUR: Impossible de lire la version distante. Le fichier telecharge est incomplet ou invalide."
            $msg | Out-File -FilePath $summaryPath -Append
            Write-Host $msg
            Remove-Item $tempFile
            exit 1
        }

        # Comparaison
        if ($localVer -lt $remoteVer) {
            $msg = "Nouvelle version disponible !`nLocale : $localVer`nEn ligne : $remoteVer"
            $msg | Out-File -FilePath $summaryPath -Append
            Write-Host "Nouvelle version disponible !"
            Write-Host "Locale : $localVer"
            Write-Host "En ligne : $remoteVer"
            Remove-Item $tempFile
            exit 1
        }

        $msg = "La version locale est a jour."
        $msg | Out-File -FilePath $summaryPath -Append
        Write-Host $msg

        Remove-Item $tempFile

  # ------------------------------------------------------------------------
  # 1. JOB WINDOWS
  # ------------------------------------------------------------------------
  package_for_windows:
    name: Package for Windows
    runs-on: windows-latest
    needs: [ check_vc_redist_version ]
    permissions:
      contents: read
    environment: production
    env:
      LIBERICA_VERSION: 25.0.3
      OPENJDK_VERSION: 25.0.3+12
      LIBERICA_FOLDER: LibericaNIK-25-OpenJDK-25
      LIBERICA_MSI: bellsoft-liberica-vm-openjdk25.0.3+12-25.0.3+2-windows-amd64.msi
      MSVC_VCVARS: C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Extract locale properties from pom.xml
        shell: pwsh
        run: |
          # Ajout de guillemets autour des arguments Maven pour pwsh
          $lang = (.\mvnw.cmd help:evaluate "-Dexpression=app.lang" -q "-DforceStdout").Trim()
          $country = (.\mvnw.cmd help:evaluate "-Dexpression=app.country" -q "-DforceStdout").Trim()
          echo "APP_LANG=$lang" >> $env:GITHUB_ENV
          echo "APP_COUNTRY=$country" >> $env:GITHUB_ENV
          Write-Host "Extracted: Lang=$lang, Country=$country"

      - name: Set JAVA_TOOL_OPTIONS from pom.xml
        shell: pwsh
        run: |
          echo "JAVA_TOOL_OPTIONS=-Duser.language=$env:APP_LANG -Duser.country=$env:APP_COUNTRY -Duser.region=$env:APP_COUNTRY" >> $env:GITHUB_ENV

      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\.m2\repository
          key: maven-repo-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-repo-${{ runner.os }}-

      - name: Cache Liberica NIK installer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: liberica-nik.msi
          key: liberica-nik-${{ runner.os }}-${{ env.LIBERICA_VERSION }}

      - name: Download and install Liberica NIK via MSI
        shell: cmd
        run: |
          if not exist liberica-nik.msi (
            curl -L --proto "=https" -o liberica-nik.msi https://download.bell-sw.com/vm/${{ env.LIBERICA_VERSION }}/${{ env.LIBERICA_MSI }}
          )
          msiexec /quiet /i liberica-nik.msi

      - name: List BellSoft installation folders
        shell: cmd
        run: dir "C:\Program Files\BellSoft"

      - name: Set JAVA_HOME and update PATH
        shell: pwsh
        run: |
          $env:JAVA_HOME = "C:\Program Files\BellSoft\${{ env.LIBERICA_FOLDER }}"
          echo "JAVA_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          echo "NIK_HOME=$env:JAVA_HOME" >> $env:GITHUB_ENV
          echo "$env:JAVA_HOME\bin" >> $env:GITHUB_PATH
          echo "$env:JAVA_HOME\lib" >> $env:GITHUB_PATH

      - name: Configure MSVC for Native Image
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Extract version from pom.xml
        shell: pwsh
        run: |
          $pom = Get-Content "pom.xml" -Raw
          if ($pom -match '<parent>[\s\S]*?</parent>[\s\S]*?<version>(.+?)</version>') {
            $version = $matches[1]
          } elseif ($pom -match '<version>(.+?)</version>') {
            $version = $matches[1]
          } else {
            Write-Host "❌ Impossible d'extraire la version depuis pom.xml"
            exit 1
          }
          echo "POM_VERSION=$version" >> $env:GITHUB_ENV
          Write-Host "Version extraite: $version"

      - name: Install Inno Setup
        shell: cmd
        run: winget install --id JRSoftware.InnoSetup -e --silent --accept-package-agreements --accept-source-agreements

      - name: Set INNOSETUP path
        shell: pwsh
        run: |
          $innoPath = (Get-Command "ISCC.exe" -ErrorAction SilentlyContinue).Source
          if (-not $innoPath) {
            $innoPath = Get-ChildItem "C:\Program Files (x86)\Inno Setup*", "C:\Program Files\Inno Setup*" -Filter "ISCC.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName -First 1
          }
          if (-not $innoPath -or -not (Test-Path $innoPath)) {
            Write-Host "❌ Inno Setup not found"
            exit 1
          }
          echo "INNOSETUP=$innoPath" >> $env:GITHUB_ENV
          Write-Host "Inno Setup found at: $innoPath"

      - name: Show environment variables
        shell: pwsh
        run: |
          Write-Host "JAVA_HOME=$env:JAVA_HOME"
          Write-Host "NIK_HOME=$env:NIK_HOME"
          Write-Host "PATH=$env:PATH"
          Write-Host "INNOSETUP=$env:INNOSETUP"
          Write-Host "POM_VERSION=$env:POM_VERSION"

      - name: Compile and Test with Maven
        shell: cmd
        run: |
          .\mvnw.cmd -B test -f pom.xml

      - name: Build native Windows package
        shell: cmd
        run: .\mvnw.cmd package -Pwindows-native

      - name: List files in output directory
        shell: pwsh
        run: |
          if (Test-Path output) {
            Get-ChildItem -Path output
          }

      - name: Generate hash file for Windows
        shell: pwsh
        run: |
            Get-ChildItem -Path output -Filter "*.exe" | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash
              "$hash  $($_.Name)" | Out-File -FilePath "output/hash_windows.txt" -Append -Encoding UTF8
            }

      - name: Upload output folder (Windows)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output-windows
          path: output

  # ------------------------------------------------------------------------
  # 2. JOB UBUNTU/AppImage (NIK téléchargé manuellement)
  # ------------------------------------------------------------------------
  package_for_ubuntu:
    name: Package for Ubuntu (AppImage)
    runs-on: ubuntu-latest
    needs: [package_for_windows]
    permissions:
      contents: read
    env:
      LIBERICA_VERSION: 25.0.3
      OPENJDK_VERSION: 25.0.3+12
      LIBERICA_TGZ: bellsoft-liberica-vm-openjdk25.0.3+12-25.0.3+2-linux-amd64.tar.gz
      NIK_INSTALL_DIR: $HOME/liberica-nik

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Install native dependencies
        run: |
          sudo apt update
          # Dépendances nécessaires pour la compilation native de GraalVM/Swing sous Linux
          sudo apt install build-essential libz-dev zlib1g-dev libxext-dev libxi-dev libxrender-dev libxtst-dev libfontconfig1 -y

      - name: Cache Liberica NIK tarball
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: liberica-nik.tar.gz
          key: liberica-nik-${{ runner.os }}-${{ env.LIBERICA_VERSION }}

      - name: Download and Extract Liberica NIK (Linux)
        shell: bash
        run: |
          NIK_FILE="liberica-nik.tar.gz"
          DOWNLOAD_URL="https://download.bell-sw.com/vm/${{ env.LIBERICA_VERSION }}/${{ env.LIBERICA_TGZ }}"

          if [ ! -f "$NIK_FILE" ]; then
            echo "Downloading NIK from $DOWNLOAD_URL"
            curl -L --proto "=https" -o "$NIK_FILE" "$DOWNLOAD_URL"
          fi

          # Crée le dossier cible et extrait l'archive
          mkdir -p ${{ env.NIK_INSTALL_DIR }}
          tar -xzf "$NIK_FILE" -C ${{ env.NIK_INSTALL_DIR }} --strip-components=1

      - name: Set JAVA_HOME and update PATH
        shell: bash
        run: |
          # Définit JAVA_HOME (utilisé par Maven) et met à jour le PATH pour trouver native-image
          echo "JAVA_HOME=${{ env.NIK_INSTALL_DIR }}" >> $GITHUB_ENV
          echo "NIK_HOME=${{ env.NIK_INSTALL_DIR }}" >> $GITHUB_ENV
          echo "${{ env.NIK_INSTALL_DIR }}/bin" >> $GITHUB_PATH

      - name: Check Java environment (NIK confirmed)
        run: |
          # Utilise maintenant le PATH mis à jour
          java -version
          native-image --version

      - name: Extract app properties from pom.xml
        id: properties
        run: |
          APP_NAME=$(./mvnw help:evaluate -Dexpression=app.name -q -DforceStdout)
          APP_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          ORG_NAME=$(./mvnw help:evaluate -Dexpression=app.org -q -DforceStdout)
          MAIN_CLASS=$(./mvnw help:evaluate -Dexpression=app.mainclass -q -DforceStdout)
          LANG_CODE=$(./mvnw help:evaluate -Dexpression=app.lang -q -DforceStdout)
          COUNTRY_CODE=$(./mvnw help:evaluate -Dexpression=app.country -q -DforceStdout)
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "POM_VERSION=$APP_VERSION" >> $GITHUB_ENV
          echo "ORG_NAME=$ORG_NAME" >> $GITHUB_ENV
          echo "MAIN_CLASS=$MAIN_CLASS" >> $GITHUB_ENV
          echo "LANG_CODE=$LANG_CODE" >> $GITHUB_ENV
          echo "COUNTRY_CODE=$COUNTRY_CODE" >> $GITHUB_ENV

      # Xvfb pour la simulation Swing
      - name: Install Xvfb
        run: sudo apt-get install -y xvfb

      - name: Start Xvfb and set DISPLAY
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Build native Linux package
        shell: bash
        run: ./mvnw package -Plinux-native

      - name: Generate hash file for AppImage
        shell: bash
        run: |
          APPIMAGE_FILE=$(find output -name "*.AppImage" | head -n 1)
          if [ -f "$APPIMAGE_FILE" ]; then
            hash=$(sha256sum "$APPIMAGE_FILE" | awk '{print $1}')
            filename=$(basename "$APPIMAGE_FILE")
            echo "$hash  $filename" > output/hash_ubuntu.txt
          else
            echo "❌ AppImage file not found in output directory."
            exit 1
          fi

      - name: Upload output folder (AppImage)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: output-ubuntu
          path: output

  # ------------------------------------------------------------------------
  # 3. JOB PUBLISH (Adapté pour dépendre des deux jobs précédents et télécharger les deux artifacts)
  # ------------------------------------------------------------------------
  publish_release:
    name: Publish the release and tag it
    needs: [package_for_windows, package_for_ubuntu]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Ensure mvnw is executable
        run: chmod +x mvnw

      - name: Extract version from pom.xml
        shell: bash
        run: |
          version=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "POM_VERSION=$version" >> $GITHUB_ENV

      - name: Download all output folders
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: .

      - name: Merge output folders
        run: |
          mkdir -p output
          # Copie des fichiers de Windows
          cp output-windows/* output/
          # Copie des fichiers d'Ubuntu
          cp output-ubuntu/* output/

      - name: List files in final output directory
        run: ls -la output/

      - name: GPG - Import private key using an isolated configuration
        if: env.GPG_PUBLIC_KEY != ''
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "::add-mask::$GPG_PRIVATE_KEY"
          export GNUPGHOME=$(mktemp -d)
          chmod 700 $GNUPGHOME
          echo "$GPG_PRIVATE_KEY" | gpg --batch --yes --import
          echo "allow-loopback-pinentry" > $GNUPGHOME/gpg-agent.conf
          gpgconf --homedir $GNUPGHOME --reload gpg-agent
          echo "GNUPGHOME=$GNUPGHOME" >> $GITHUB_ENV

      - name: GPG - Sign and verify files (excluding .txt and .asc)
        if: env.GPG_PUBLIC_KEY != ''
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          echo "::add-mask::$GPG_PASSPHRASE"
          export GPG_TTY=$(tty)

          # List files in output directory
          echo "Files in output directory:"
          ls -la output/

          for file in output/*; do
            if [[ -f "$file" && ! "$file" == *.txt && ! "$file" == *.asc ]]; then
              echo "Signing file: $file"
              gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" --detach-sign --armor -o "$file.asc" "$file"
              gpg --verify "$file.asc" "$file"
            fi
          done

      - name: GPG - Clean up GNUPGHOME
        if: env.GPG_PUBLIC_KEY != ''
        run: rm -rf $GNUPGHOME

      - name: GPG - Export public key from secrets and save to output
        if: env.GPG_PUBLIC_KEY != ''
        run: |
          mkdir -p output
          echo "$GPG_PUBLIC_KEY" > output/canscan-public-key.asc

      - name: Create Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: CanScan release v${{ env.POM_VERSION }}
          tag: v${{ env.POM_VERSION }}
          body: |
            ## 📲 CanScan v${{ env.POM_VERSION }}

            🪟 Windows (x64)

            Lien de l'installateur (Inno Setup) :

            &nbsp;&nbsp;&nbsp;&nbsp;[![Windows Setup](https://img.shields.io/badge/Setup-CanScan--${{ env.POM_VERSION }}--x64--Setup.exe-brightgreen.svg)](https://github.com/${{ github.repository }}/releases/download/v${{ env.POM_VERSION }}/CanScan-${{ env.POM_VERSION }}-x64-Setup.exe)

            🐧 Linux (AppImage x86_64)

            Lien du binaire natif (glibc/Debian) :

            &nbsp;&nbsp;&nbsp;&nbsp;[![Linux AppImage](https://img.shields.io/badge/Linux_AppImage-CanScan--${{ env.POM_VERSION }}--x86__64.AppImage-blue.svg)](https://github.com/${{ github.repository }}/releases/download/v${{ env.POM_VERSION }}/CanScan-${{ env.POM_VERSION }}-x86_64.AppImage)

            ## 🔒 Vérifications

            **Pour garantir l'intégrité des fichiers téléchargés, vérifiez leur signature à l'aide de la clé publique GPG correspondante**

            ### 🔑 Clé Publique et Signatures GPG

            Lien vers la clé publique GPG :

            &nbsp;&nbsp;&nbsp;&nbsp;[![Public GPG (GNU Privacy Guard)](https://img.shields.io/badge/Public_GPG-canscan--public--key.asc-brightgreen.svg)](https://github.com/${{ github.repository }}/releases/download/v${{ env.POM_VERSION }}/canscan-public-key.asc)

            Lien vers les signatures Windows GPG :

            &nbsp;&nbsp;&nbsp;&nbsp;[![Setup Signature](https://img.shields.io/badge/Signature-Setup.exe.asc-brightgreen.svg)](https://github.com/${{ github.repository }}/releases/download/v${{ env.POM_VERSION }}/CanScan-${{ env.POM_VERSION }}-x64-Setup.exe.asc)
            &nbsp;

            Lien vers la signature Linux GPG :

            &nbsp;&nbsp;&nbsp;&nbsp;[![Linux Signature](https://img.shields.io/badge/Signature-AppImage.asc-blue.svg)](https://github.com/${{ github.repository }}/releases/download/v${{ env.POM_VERSION }}/CanScan-${{ env.POM_VERSION }}-x86_64.AppImage.asc)

            ### 🧮️ Empreintes des Fichiers (Hashes)

            L'intégrité des fichiers téléchargés peut être vérifiée à l'aide du fichier de hash correspondant

            Lien du fichier de hash Windows :

            &nbsp;&nbsp;&nbsp;&nbsp;[![Windows Hash](https://img.shields.io/badge/Hash_File-hash_windows.txt-brightgreen.svg)](https://github.com/${{ github.repository }}/releases/download/v${{ env.POM_VERSION }}/hash_windows.txt)

            Lien du fichier de hash Linux :

            &nbsp;&nbsp;&nbsp;&nbsp;[![Linux Hash](https://img.shields.io/badge/Hash_File-hash_ubuntu.txt-blue.svg)](https://github.com/${{ github.repository }}/releases/download/v${{ env.POM_VERSION }}/hash_ubuntu.txt)

          artifacts: 'output/*'

      - name: Create Tag
        run: git tag v${{ env.POM_VERSION }}

      - name: Push Tag
        run: git push --tags

      - name: Delete all artifacts and output folder after publishing
        uses: geekyeggo/delete-artifact@176a747ab7e287e3ff4787bf8a148716375ca118 # v6.0.0
        with:
          name: |
            output-windows
            output-ubuntu

      - name: Remove output directory
        run: rm -rf output
