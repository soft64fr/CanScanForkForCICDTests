name: Test and SonarQube Analysis

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  test_and_analyze:
    name: Test and SonarQube Analysis
    runs-on: windows-latest
    environment: production

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e3f713f2d8f53843e71c69a996d56f51aa9adfb9 # v2.14.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '25'
          cache: 'maven'

      - name: Set Java Options
        shell: pwsh
        run: |
          echo "JAVA_TOOL_OPTIONS=-Duser.language=fr -Duser.country=FR -Duser.region=FR -Djava.awt.headless=false -Dsun.awt.disablegrab=true" >> $env:GITHUB_ENV

      - name: Compile, Test, and analyze with Maven profile
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
#          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          .\mvnw.cmd -B test -f pom.xml
#          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar ^
#          -Dsonar.projectKey=Lob2018_CanScan ^
#          -Dsonar.qualitygate.wait=true ^
#          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
