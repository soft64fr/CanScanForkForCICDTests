name: Test and SonarQube Analysis

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  test_and_analyze:
    name: Test and SonarQube Analysis
    runs-on: windows-latest
    permissions:
      contents: read      # Pour l'analyse du code
      pull-requests: read # Requis pour que SonarQube puisse commenter/analyser les PR
    environment: production

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'liberica'
          java-version: '25'
          cache: 'maven'

      - name: Set Java Options
        shell: pwsh
        run: |
          echo "JAVA_TOOL_OPTIONS=-Duser.language=fr -Duser.country=FR -Duser.region=FR -Djava.awt.headless=false -Dsun.awt.disablegrab=true" >> $env:GITHUB_ENV

      - name: Compile, Test, and analyze with Maven profile
        shell: cmd
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Needed to get PR information, if any
        run: |
          .\mvnw.cmd -B test -f pom.xml
